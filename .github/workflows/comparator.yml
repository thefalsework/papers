# Verify the ordinary-elements-z6 preprint's Lean formalization with
# leanprover/comparator: lean/Solution.lean (importing the project code) must
# prove the exact statements in lean/Challenge.lean (importing Mathlib only)
# using only propext / Classical.choice / Quot.sound, kernel-accepted, inside
# a landrun sandbox.
#
# Comparator requires Linux (landrun uses Landlock), so CI is the canonical
# run; local runs on Windows/macOS are not supported by the sandbox.
name: comparator

on:
  push:
    branches: [main]
    paths:
      - 'lean/**'
      - '.github/workflows/comparator.yml'
  pull_request:
    paths:
      - 'lean/**'
      - '.github/workflows/comparator.yml'
  workflow_dispatch:

env:
  # lean4export publishes no v4.30.0-rc2 tag; v4.30.0 (same release, stable)
  # is the nearest compatible export version for our pinned toolchain.
  LEAN4EXPORT_TAG: v4.30.0
  # landrun was previously built from an unpinned `main`. The last passing
  # run (2026-07-13, 73173a3) built main as of 5ed4a3d (2025-10-01,
  # v0.1.15+15, urfave/cli v2). On 2026-07-22 landrun merged PR #50, which
  # upgraded to urfave/cli v3; v3's parser drops a bare "--" from the
  # positional args, and comparator invokes `landrun ... lean4export <module>
  # -- <decl>...`, so every run after the tools cache expired (first failure
  # 2026-07-29) had lean4export read the declaration names as module names
  # ("unknown module prefix 'four_regions_iff_ordinary'"). landrun main still
  # has this behaviour (2026-10-12). Pin to the last urfave/cli v2 commit;
  # bump CACHE_KEY_SUFFIX when any tool pin changes.
  # (An earlier pin, f59e83d, was a PR #50 commit misread as main's tip and
  # already carried urfave/cli v3: same failure.)
  LANDRUN_COMMIT: 5ed4a3db3a4ad930d577215c6b9abaa19df7f99f
  CACHE_KEY_SUFFIX: v3

jobs:
  comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned toolchain
        id: toolchain
        run: echo "version=$(cat lean/lean-toolchain | sed 's/.*://')" >> "$GITHUB_OUTPUT"

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Set up Go (for landrun)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Cache tools (landrun, lean4export, comparator)
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: tools
          key: comparator-tools-${{ steps.toolchain.outputs.version }}-${{ env.CACHE_KEY_SUFFIX }}

      - name: Build landrun
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools
          git clone https://github.com/Zouuup/landrun.git tools/landrun-src
          cd tools/landrun-src
          git checkout "$LANDRUN_COMMIT"
          go build -o ../landrun-bin/landrun cmd/landrun/main.go

      - name: Build lean4export (nearest tag, pinned project toolchain)
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/leanprover/lean4export.git tools/lean4export
          cd tools/lean4export
          git checkout "$LEAN4EXPORT_TAG"
          # Build against the project's exact toolchain so olean formats match.
          cp "$GITHUB_WORKSPACE/lean/lean-toolchain" lean-toolchain
          lake build

      - name: Build comparator (matching toolchain)
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/leanprover/comparator.git tools/comparator
          cd tools/comparator
          git checkout ${{ steps.toolchain.outputs.version }}
          lake build

      - name: Cache Lean project build
        uses: actions/cache@v4
        with:
          path: |
            lean/.lake
            ~/.cache/mathlib
          key: lake-${{ steps.toolchain.outputs.version }}-${{ hashFiles('lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ steps.toolchain.outputs.version }}-${{ hashFiles('lean/lake-manifest.json') }}-

      - name: Get Mathlib cache
        working-directory: lean
        run: lake exe cache get

      - name: Build solution and challenge
        working-directory: lean
        run: |
          lake build
          lake build Challenge
          lake build Solution
          lake build ChallengeChecks

      - name: Run comparator
        working-directory: lean
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/tools/landrun-bin:$GITHUB_WORKSPACE/tools/lean4export/.lake/build/bin:$GITHUB_WORKSPACE/tools/comparator/.lake/build/bin"
          set +e
          lake env comparator config.json > comparator.log 2>&1
          rc=$?
          set -e
          # Publish the verdict and environment to the job summary so the
          # result is readable from the run page without log access.
          {
            echo "## comparator: exit $rc"
            echo
            echo '```'
            echo "kernel: $(uname -r)"
            echo "landrun: $(command -v landrun) ($(landrun --version 2>&1 | head -n1))"
            echo "lean4export: $(command -v lean4export)"
            echo "comparator: $(command -v comparator)"
            echo "lean: $(lean --version)"
            echo '```'
            echo
            echo '### output (last 6000 bytes)'
            echo '```'
            tail -c 6000 comparator.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat comparator.log
          # Also surface the tail as check-run annotations: unlike logs and
          # the step summary, annotations are readable on the public run page
          # and via the unauthenticated REST API.
          esc() { sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
          echo "::notice title=comparator environment::kernel $(uname -r); landrun $(landrun --version 2>&1 | head -n1); lean $(lean --version)"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=comparator exit $rc (log tail 1/2)::$(tail -c 6000 comparator.log | head -c 3000 | esc)"
            echo "::error title=comparator exit $rc (log tail 2/2)::$(tail -c 3000 comparator.log | esc)"
          fi
          exit $rc
