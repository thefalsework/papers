# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
#
# formalization.yaml (Mathlib Initiative schema v0.4) for the Lean 4
# formalization backing the preprint "The Unique Ordinary Element of a
# One-Generated Heyting Algebra, the Subgroup Lattice of Z/12Z, and a
# Characterization of n = p^2 q" (preprints/ordinary-elements-z6/).
#
# The Lean project lives in lean/ (not the repository root): toolchain in
# lean/lean-toolchain, dependency pins in lean/lake-manifest.json, build in
# .github/workflows/comparator.yml. Those are not duplicated here.
#
# History: first written 2026-07-12 in a pre-v0.4 ad hoc shape; migrated to
# v0.4 on 2026-10-12. Keys outside the v0.4 template (verification,
# scope_files, known_gaps, additional_tracks) are retained as extra keys,
# which the schema permits.

version: "v0.4"

project:
  name: falsework-papers-ordinary-elements
  description: >-
    Kernel-checked structure theory of one-generated Heyting algebras:
    Nishimura's one-variable normal form, the four-region non-degeneracy
    criterion (all four regions relative to a are inhabited iff a is
    ordinary, i.e. neither regular nor dense), uniqueness of the ordinary
    element in an algebra one-generated by an ordinary element (statement
    in Citkin 2025, previously unproved), the six-element threshold and the
    Z6 order-embedding forced by any ordinary element, the H8 converse
    counterexample, the divisor lattice of 12 as Z6 with the divisor 2
    (tritone) as unique ordinary element, the p^2 q characterization and
    the general k-prime existence/uniqueness/count laws, and the
    substitution monoid End(Z6) = Z6.
  authors:
    - "Claude (Anthropic), AI, working in Cursor: all Lean proofs"
    - "Chris Brink: direction, statement review, prior-art adjudication"
  responsible_maintainers:
    - "Chris Brink (chris@falsework.dev)"
  license: "CC-BY-4.0 (preprint); Apache-2.0 (Lean sources, see LICENSE-CODE)"

repository:
  role: substantive-development

sources:
  - title: >-
      The Unique Ordinary Element of a One-Generated Heyting Algebra, the
      Subgroup Lattice of Z/12Z, and a Characterization of n = p^2 q
    authors: ["Chris Brink"]
    id: preprints/ordinary-elements-z6/paper.md
    type: preprint
    location: "Theorems 3.2, 4.1, 4.2, 5.1, 5.2, 8.1(4) (comparator scope); section 10 audit table"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      Paper and formalization were developed together by the same author;
      the paper's section 10 is the per-theorem audit table of the Lean.
  - title: "Hereditarily structurally complete superintuitionistic logics and primitive varieties of Heyting algebras"
    authors: ["Alex Citkin"]
    id: "arXiv:2512.05633"
    type: article
    location: "p. 13: Z_n contains a single ordinary element that generates the entire algebra (asserted without proof)"
    relationship: formalizes
    author_endorsement: other
    note: >-
      The uniqueness statement (unique_ordinary_element) is Citkin's; the
      written proof here is apparently the first. Prior-art standing was
      adjudicated by correspondence with Citkin (personal communication
      2026-06-11, cited with permission; record at docs/outreach/citkin-email.md).
      That correspondence concerned novelty, not review of the Lean; it is
      not an endorsement of the formalization.
  - title: "An algebraic proof of the Nishimura theorem"
    authors: ["Alex Citkin"]
    id: "Logics 2(4), 2024, 148-157"
    type: article
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Definitions of regular, dense, ordinary (section 2.1); Theorem 6
      (exactly one one-generated Heyting algebra of each finite cardinality)
      is used as a literature dependency for the identification Div12 = Z6
      in the paper's Theorem 7.1; Proposition 4(c) is the one-generated
      special case of the threshold theorem.
  - title: "On formulas of one variable in intuitionistic propositional calculus"
    authors: ["Iwao Nishimura"]
    id: "Journal of Symbolic Logic 25, 1960"
    type: article
    relationship: independently-proves
    author_endorsement: n/a
    note: >-
      nishimura_normal_form is the classical one-variable normal form; the
      Lean proof is the project's own (closure tables over the ladder), not
      a transcription of Nishimura's or Citkin's argument.
  - title: "A remark on the so-called free closure algebras"
    authors: ["Ladislav Rieger"]
    id: "Czechoslovak Mathematical Journal 7, 1957"
    type: article
    relationship: background
    author_endorsement: n/a

