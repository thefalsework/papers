fidelity:
  divergences: >-
    (1) ordinary_forces_card_ge_six adds [Fintype H]; the paper's Theorem 4.1
    states |H| >= 6 for any H, which for infinite H is carried by the
    embedding theorem. (2) twelve_unique_kernel is stated on Fin 3 x Fin 2
    with Mathlib's product Heyting structure, not on the literal divisor
    lattice of 12; the order-isomorphism Div12 = Fin 3 x Fin 2 is
    kernel-checked in the library (div12OrderIsoChains) but is not part of
    the challenge statement, because Mathlib has no Heyting structure on
    the divisors of 12 to state it against. (3) OrdinaryElement is the
    two-clause form (not not a != a, not a != bot); the paper's section 2.1
    uses the three-clause form with a != bot added. The forms are equivalent
    (a = bot is regular); the equivalence is kernel-checked in
    lean/ChallengeChecks.lean (ordinaryElement_iff_three_clause). (4)
    FourRegionsInhabited lists the regions in the order I, D, E, R rather
    than the paper's I, R, E, D. (5) rnLadder's rung indexing follows the
    paper's section 2.2; indexing conventions in the literature differ and
    no rung-by-rung correspondence with Nishimura 1960 is claimed; the
    challenge's normal-form statement is indexing-independent because
    lean/ChallengeChecks.lean (rnLadder_generated) checks the converse
    inclusion, making it a two-sided characterization of the generated set.
    Closed 2026-10-12: ordinary_gives_z6_embedding was previously the
    existential "some order-embedding Fin 3 x Fin 2 -> H exists"; it now
    states that the paper's explicit map z6Landmarks g (bot, g, not g,
    not not g, g or not g, top, in divisor order 1, 2, 3, 4, 6, 12)
    preserves and reflects order, matching Theorem 4.2.

review:
  status: agent-reviewed
  reviewers:
    - "Chris Brink (human author; not a Lean reader): compared each challenge statement to the paper's theorem wording using an agent-prepared side-by-side, with the deviations disclosed under fidelity.divergences; did not review proofs"
    - "Independent AI model (cross-model pre-audit, 2026-07-12): OrdinaryElement vs Citkin's definition, redundancy of the compl constructor, non-bot guards in FourRegionsInhabited, rnLadder rungs 5-6"
  notes: >-
    No human Lean expert has reviewed the challenge statements. External
    review was requested in Lean Zulip #AI-authored-projects (2026-07) and
    remains open. Comparator certifies that Solution proves the exact
    Challenge statements with the three standard axioms; it cannot certify
    that Challenge.lean says what the paper says. That gap is the one this
    record is honest about. 2026-10-12: the human author, who does not read
    Lean, compared each of the six challenge statements to the paper's
    theorem wording (Theorems 3.2, 5.1, 5.2, 4.1, 4.2, 8.1(4)) using a
    side-by-side prepared by the agent, which also stated the deviations;
    the deviations are recorded under fidelity.divergences. Of the three
    weakenings found, the Z6 embedding (Theorem 4.2) was closed the same
    day by restating it on the paper's explicit map; the finite-only
    cardinality bound (1) and the Fin 3 x Fin 2 domain (2) stand as
    disclosed. The equivalences the review relied on are kernel-checked in
    lean/ChallengeChecks.lean, built in CI. Axioms re-audited
    the same day with #print axioms against a fresh build: as listed per
    result above; no sorryAx, no Lean.ofReduceBool. CI status: the
    comparator workflow passed at 73173a3 (2026-07-13) and failed at the
    "Run comparator" step on every run from d5dca50 (2026-07-29) through
    7b7763b (2026-10-12), the Lean build step passing each time. Root
    cause, from the run logs: the one unpinned input, landrun, merged an
    upgrade to urfave/cli v3 on 2026-07-22 whose parser drops the bare "--"
    that comparator uses to separate the module from the declaration names
    in its lean4export call, so lean4export read the theorem names as
    module names and aborted before any checking ("unknown module prefix
    'four_regions_iff_ordinary'"). No Lean content was ever at fault. The
    first repin (f33bea3, 2026-10-12) chose a commit that was not main's
    July tip and failed the same way; the second (5cf1aa9, same day) pins
    the last urfave/cli v2 commit and passes. See
    verification.last_passing_comparator_run for the verification of
    record, which covers the strengthened Z6 statement.

