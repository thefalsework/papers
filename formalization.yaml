known_gaps:
  - >-
    Minimality of the H8 counterexample (eight is the least cardinality) is
    established by script-level enumeration, not in Lean; flagged in the
    paper (section 6).
  - >-
    The classical structure theorem "divisor lattice of n = product of one
    chain per prime" is cited, not formalized, for general n; the n = 12
    instance is kernel-checked (div12OrderIsoChains).
  - >-
    Div12 = Z6 as an abstract isomorphism rests on Citkin 2024 Theorem 6;
    the Lean establishes one-generation of Div12 by the tritone and the
    kernel/embedding facts directly.

additional_tracks:
  - name: opposition-figure-and-bridge
    title: "The opened square: bridge theorem + opposition figure (Lean 4)"
    paper: preprints/opposition-figure/paper.md
    short_description: >-
      Welds the topos stack (four-position partition) to the lattice stack
      (ordinary elements): the partition at Y is non-degenerate iff the
      kernel image is ordinary in Sub(D Y), and ordinary kernels force the
      Z6 order-embedding (OrdinaryKernel.lean). Formalizes the opposition
      figure: the six landmarks bot, not-a, a, not-not-a, a-or-not-a, top
      are pairwise distinct iff a is ordinary (T1); classical/regular/dense
      collapse laws; the skeleton theorem (each middle landmark inhabits its
      partition cell); on Div12 at the tritone the figure is the identity;
      Blanche's 1966 hexagon is not order-isomorphic to Z6 (T2)
      (OppositionFigure.lean). The Aristotelian relation profile of the
      opened square (OppositionRelations.lean): at an ordinary a the
      negation pair a, not-a is contrary and never contradictory (the
      element-local form of Beziau 2003); three strict subalternations;
      the E-I and I-U pairs split on the Stone identity at a (weak excluded
      middle), contradictory + subcontrary if it holds (as on Z6 at the
      tritone, proved computably), contrary + unconnected (Demey-Smessaert's
      fourth relation) if it fails.
    files:
      - lean/FalseWorkPapers/Positions/OrdinaryKernel.lean
      - lean/FalseWorkPapers/Examples/OppositionFigure.lean
      - lean/FalseWorkPapers/Examples/OppositionRelations.lean
    sorry_count: 0
    native_decide: false
    axioms: at most propext, Classical.choice, Quot.sound (per-theorem audit table in the paper, section 10)
    comparator: none (not in the challenge module)
    review_record:
      - >-
        BlancheHexagon cover table vs. Blanche (1966): reviewed 2026-07-29
        (AI web-research under direction) against three independent
        specialist descriptions (Beziau, "The metalogical hexagon of
        opposition," Argumentos 2013, citing Blanche 1966 directly;
        Dubois-Prade-Rico, AMAI 2015; standard references). All six
        entailment edges, both incomparability triangles, and the three
        contradictory pairs match. Residual: the 1966 French primary text
        was not consulted (no accessible copy).
      - >-
        Intuitionistic-square chapters: reviewed 2026-07-29. Records
        correction: only one such chapter is in the 2012 volume (Meles,
        "No Group of Opposition for Constructive Logics," pp. 201-217,
        group-theoretic); the other is Vidal-Rosset, "The Exact
        Intuitionistic Meaning of the Square of Opposition," in the 2017
        volume The Square of Opposition: A Cornerstone of Thought
        (pp. 291-303, prover-driven). Neither works at the algebra-element
        level or states the ordinariness equivalence; targeted searches for
        square + Rieger-Nishimura and square + regular/dense elements came
        back empty. Residual: full chapter texts paywalled; review rests on
        abstracts, the authors' own congress summaries, and citing
        literature, all concordant.
  - name: aperture-and-falsework
    title: "Aperture closed form and the falsework inequality (Lean 4)"
    short_description: >-
      Kernel-checked results outside the ordinary-elements paper: the
      aperture closed form at every arity (aperture_closed_form_pi,
      Lattice/ApertureClosedFormPi.lean), the falsework inequality
      (falsework_inequality, Lattice/FalseworkInequality.lean), the
      morphism-level four-position partition (four_position_partition,
      Positions/Partition.lean). Each has its own paper and audit table;
      none is in the challenge module.
    files:
      - lean/FalseWorkPapers/Lattice/ApertureClosedFormPi.lean
      - lean/FalseWorkPapers/Lattice/FalseworkInequality.lean
      - lean/FalseWorkPapers/Positions/Partition.lean
    sorry_count: 0
    native_decide: false
    comparator: none (not in the challenge module)
